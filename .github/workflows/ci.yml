name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: staffhub_ci
          POSTGRES_USER: staffhub
          POSTGRES_PASSWORD: staffhub_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffhub -d staffhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://staffhub:staffhub_ci_only@localhost:5432/staffhub_ci?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

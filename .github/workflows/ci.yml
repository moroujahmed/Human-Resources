name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_DB: staffhub_ci
          POSTGRES_USER: staffhub
          POSTGRES_PASSWORD: staffhub_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffhub -d staffhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://staffhub:staffhub_ci_only@localhost:5432/staffhub_ci?schema=public
      NODE_ENV: test
      POSTGRES_HOST_PORT: 5433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - name: Verify database constraints on PostgreSQL 16
        env:
          PGPASSWORD: staffhub_ci_only
        run: psql -h localhost -U staffhub -d staffhub_ci -v ON_ERROR_STOP=1 -f scripts/check-db-constraints.sql
      - name: Verify Phase 2 database constraints on PostgreSQL 16
        env:
          PGPASSWORD: staffhub_ci_only
        run: psql -h localhost -U staffhub -d staffhub_ci -v ON_ERROR_STOP=1 -f scripts/check-phase2-db.sql
      - name: Verify isolated demo seed on PostgreSQL 16
        env:
          DEMO_MODE: "true"
        run: |
          DEMO_SEED_PASSWORDS="$(node -e 'const c=require(\"node:crypto\"); const emails=[\"raymond.mugisha@example.invalid\",\"julius.okello@example.invalid\",\"grace.akello@example.invalid\",\"grace.apio@example.invalid\",\"michael.kigozi@example.invalid\",\"sarah.namubiru@example.invalid\",\"joseph.mukasa@example.invalid\",\"brian.kato@example.invalid\",\"rebecca.kisakye@example.invalid\",\"fiona.namatovu@example.invalid\",\"ivan.tumusiime@example.invalid\",\"denis.mukasa@example.invalid\",\"samuel.ssebunya@example.invalid\",\"amina.nabakooza@example.invalid\"]; const values={}; for(const email of emails) values[email]=`Ci${c.randomBytes(12).toString(\"base64url\")}A1`; process.stdout.write(JSON.stringify(values));')"
          export DEMO_SEED_PASSWORDS
          npm run db:seed
      - run: npm audit --omit=dev
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start Docker Compose stack
        run: docker compose --env-file .env.docker.example up --build --detach
      - name: Verify Docker Compose health endpoints
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health \
              && curl --fail --silent http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.docker.example ps
          docker compose --env-file .env.docker.example logs
          exit 1
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose --env-file .env.docker.example down --volumes --remove-orphans
